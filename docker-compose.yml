services:
  endless-ride:
    build: .
    container_name: endless-ride
    restart: unless-stopped
    ports:
      - "8080:8080/tcp"
      - "8080:8080/udp"
    environment:
      - LEADERBOARD_FILE=/app/data/leaderboard.json
    volumes:
      - ./data:/app/data
    # Uncomment the lines below if using a wired I2C MPU-6050 on Raspberry Pi GPIO:
    # devices:
    #   - "/dev/i2c-1:/dev/i2c-1"
